<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta UMKM Pribadi</title>
    
    <!-- CSS Leaflet.js -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: sans-serif;
        }
        #map {
            height: 100vh;
            width: 100vw;
        }
        
        /* Tombol Mengambang untuk Membuka Form */
        #toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1001;
            background: #28a745;
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Panel Form Sederhana (Default Tersembunyi / Display: none) */
        #form-panel {
            display: none;
            position: absolute;
            top: 70px;
            right: 20px;
            z-index: 1000;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 280px;
            max-width: 90vw;
        }
        #form-panel input, #form-panel textarea, #form-panel select, #form-panel button {
            width: 100%;
            margin-bottom: 10px;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #form-panel button[type="submit"] {
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Tombol untuk Buka/Tutup Form -->
    <button id="toggle-btn" onclick="toggleForm()">+ Tambah Lokasi</button>

    <!-- Panel Form Input -->
    <div id="form-panel">
        <h3>Tambah Lokasi Baru</h3>
        <p style="font-size: 0.8em; color: #666; margin-top: 0;">Klik peta untuk ambil koordinat.</p>
        <form id="addForm">
            <input type="text" id="nama" placeholder="Nama Tempat / Usaha" required>
            <select id="kategori">
                <option value="Kuliner">Kuliner</option>
                <option value="Pedagang Keliling">Pedagang Keliling</option>
                <option value="Jasa / Lainnya">Jasa / Lainnya</option>
            </select>
            <textarea id="catatan" placeholder="Catatan (Jam buka, keunikan, dll)" rows="3"></textarea>
            
            <input type="text" id="lat" placeholder="Latitude" readonly required style="background: #eee;">
            <input type="text" id="lng" placeholder="Longitude" readonly required style="background: #eee;">
            
            <button type="submit">Simpan ke Peta</button>
        </form>
    </div>

    <div id="map"></div>

    <!-- JS Leaflet.js -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        var map = L.map('map').setView([-8.0954, 112.1609], 14);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let tempMarker = null;

        // Fungsi Buka Tutup Form
        function toggleForm() {
            var panel = document.getElementById('form-panel');
            var btn = document.getElementById('toggle-btn');
            if (panel.style.display === 'block') {
                panel.style.display = 'none';
                btn.innerText = '+ Tambah Lokasi';
            } else {
                panel.style.display = 'block';
                btn.innerText = 'Tutup Form';
            }
        }

        // Klik peta untuk ambil titik
        map.on('click', function(e) {
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;

            document.getElementById('lat').value = lat;
            document.getElementById('lng').value = lng;

            if (tempMarker) {
                map.removeLayer(tempMarker);
            }

            tempMarker = L.marker([lat, lng]).addTo(map)
                .bindPopup("Titik yang dipilih").openPopup();
        });

        // Contoh membuat Ikon Kustom Berbeda Tiap Kategori
        function getCustomIcon(kategori) {
            // Tuan Muda bisa mengganti URL di bawah dengan link gambar ikon lokal buatan sendiri (.png / .svg)
            let iconUrl = 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png'; // Default
            
            if (kategori === 'Kuliner') {
                iconUrl = 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png';
            } else if (kategori === 'Pedagang Keliling') {
                iconUrl = 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png';
            } else if (kategori === 'Jasa / Lainnya') {
                iconUrl = 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-orange.png';
            }

            return L.icon({
                iconUrl: iconUrl,
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [1, -34],
                shadowSize: [41, 41]
            });
        }

        // Fungsi memuat data
        function loadAllData() {
            let localData = JSON.parse(localStorage.getItem('umkm_pribadi')) || [];

            fetch('data.json')
                .then(response => response.json())
                .then(jsonData => {
                    let combinedData = [...jsonData, ...localData];
                    renderMarkers(combinedData);
                })
                .catch(() => {
                    renderMarkers(localData);
                });
        }

        function renderMarkers(data) {
            data.forEach(item => {
                // Gunakan ikon kustom berdasarkan kategori
                var customIcon = getCustomIcon(item.kategori);
                
                var marker = L.marker([item.lat, item.lng], { icon: customIcon }).addTo(map);
                var popupContent = `
                    <b>${item.nama}</b><br>
                    <span style="color: #666; font-size: 0.9em;">Kategori: ${item.kategori}</span><hr style="margin: 5px 0;">
                    ${item.catatan}
                `;
                marker.bindPopup(popupContent);
            });
        }

        loadAllData();

        // Simpan data baru
        document.getElementById('addForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const newItem = {
                id: Date.now(),
                nama: document.getElementById('nama').value,
                kategori: document.getElementById('kategori').value,
                lat: parseFloat(document.getElementById('lat').value),
                lng: parseFloat(document.getElementById('lng').value),
                catatan: document.getElementById('catatan').value
            };

            let existingData = JSON.parse(localStorage.getItem('umkm_pribadi')) || [];
            existingData.push(newItem);
            localStorage.setItem('umkm_pribadi', JSON.stringify(existingData));

            alert("Lokasi berhasil disimpan!");
            document.getElementById('addForm').reset();
            location.reload();
        });
    </script>
</body>
</html>
