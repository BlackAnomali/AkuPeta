<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AkuPeta</title>
    
    <!-- Ikon Kustom untuk Shortcut HP / PWA -->
    <link rel="icon" type="image/png" sizes="192x192" href="logo-peta.png">
    <link rel="apple-touch-icon" sizes="180x180" href="logo-peta.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- CSS Leaflet.js -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: sans-serif;
        }
        #map {
            height: 100vh;
            width: 100vw;
        }

        /* Tombol Mengambang untuk Membuka/Menutup Form */
        #toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1001;
            background: #28a745;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Panel Form Sederhana */
        #form-panel {
            display: none;
            position: absolute;
            top: 75px;
            right: 20px;
            z-index: 1000;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 280px;
            max-width: 90vw;
        }
        #form-panel input, #form-panel textarea, #form-panel select, #form-panel button {
            width: 100%;
            margin-bottom: 10px;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #form-panel button[type="submit"] {
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Tombol Mengambang Pemicu Form -->
    <button id="toggle-btn" onclick="toggleForm()">+ Tambah Lokasi</button>

    <!-- Panel Form Input -->
    <div id="form-panel">
        <h3>Tambah Lokasi Baru</h3>
        <p style="font-size: 0.8em; color: #666; margin-top: 0;">Klik pada peta untuk mengambil titik koordinat.</p>
        <form id="addForm">
            <input type="text" id="nama" placeholder="Nama Tempat / Usaha" required>
            <select id="kategori">
                <option value="Kuliner">Kuliner</option>
                <option value="Pedagang Keliling">Pedagang Keliling</option>
                <option value="Jasa / Lainnya">Jasa / Lainnya</option>
            </select>
            <textarea id="catatan" placeholder="Catatan (Jam buka, keunikan, dll)" rows="3"></textarea>

            <input type="text" id="lat" placeholder="Latitude" readonly required style="background: #eee;">
            <input type="text" id="lng" placeholder="Longitude" readonly required style="background: #eee;">

            <button type="submit">Simpan ke GitHub</button>
        </form>
    </div>

    <!-- Peta Leaflet -->
    <div id="map"></div>

    <!-- JS Leaflet.js -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- File Logika Utama Terpisah -->
    <script src="script.js"></script>
</body>
</html>
