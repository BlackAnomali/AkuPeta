<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AkuPeta</title>
    
    <!-- Ikon Kustom untuk Shortcut HP / PWA -->
    <link rel="icon" type="image/png" sizes="192x192" href="logo-peta.png">
    <link rel="apple-touch-icon" sizes="180x180" href="logo-peta.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- CSS Leaflet.js -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Menghubungkan ke File style.css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Bingkai Utama Konsol -->
    <div id="console-frame">
        
        <!-- Header Konsol -->
        <div class="console-header">
            <div class="header-title-area">
                <div class="status-dot"></div>
                <span>AKUPETA // LOCAL TACTICAL SYSTEM</span>
            </div>
            <button id="toggle-btn" onclick="toggleForm()">+ Tambah Lokasi</button>
        </div>

        <!-- Area Peta & Kontrol -->
        <div class="console-body">
            
            <!-- Panel Form Input -->
            <div id="form-panel">
                <h3>Tambah Lokasi Baru</h3>
                <p style="font-size: 0.8em; color: #fca5a5; margin-top: 0;">Klik peta untuk ambil koordinat.</p>
                <form id="addForm">
                    <input type="text" id="nama" placeholder="Nama Tempat / Usaha" required>
                    <select id="kategori">
                        <option value="Kuliner">Kuliner</option>
                        <option value="Pedagang Keliling">Pedagang Keliling</option>
                        <option value="Jasa / Lainnya">Jasa / Lainnya</option>
                    </select>
                    <textarea id="catatan" placeholder="Catatan..." rows="2"></textarea>
                    <input type="text" id="lat" placeholder="Latitude" readonly required style="background: #2b0a0a; color: #fff;">
                    <input type="text" id="lng" placeholder="Longitude" readonly required style="background: #2b0a0a; color: #fff;">
                    <button type="submit">Simpan ke GitHub</button>
                </form>
            </div>

            <!-- Tombol Filter Kategori (Vertikal di Kiri Tengah) -->
            <div id="category-filters">
                <button class="filter-btn active" onclick="toggleCategory('Kuliner', this)" title="Kuliner">
                    <img src="kuliner.svg" alt="Kuliner">
                </button>
                <button class="filter-btn active" onclick="toggleCategory('Pedagang Keliling', this)" title="Pedagang Keliling">
                    <img src="pak-ogah.svg" alt="Pedagang">
                </button>
                <button class="filter-btn active" onclick="toggleCategory('Jasa / Lainnya', this)" title="Jasa">
                    <img src="lainnya.svg" alt="Jasa">
                </button>
            </div>

            <!-- Peta Leaflet -->
            <div id="map"></div>
        </div>

        <!-- Footer Konsol (Running Text) -->
        <div class="console-footer">
            <div class="running-text">
                STATUS: SECURE LINK ACTIVE &nbsp;&bull;&nbsp; SECTOR: BLITAR, JAWA TIMUR &nbsp;&bull;&nbsp; SYSTEM READY FOR DATA SYNC &nbsp;&bull;&nbsp; TUAN MUDA CONTROL CENTER
            </div>
        </div>
    </div>

    <!-- Script Leaflet, Definisi Ikon, & Script Utama -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="icons.js"></script>
    <script src="script.js"></script>
</body>
</html>
